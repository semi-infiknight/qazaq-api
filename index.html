<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/ns-flag.svg" />
    <title>Qazaq Stack ~ every integration you need for Kazakhstan</title>
    <meta
      name="description"
      content="A searchable directory of Kazakhstan APIs — Astana, Almaty, Shymkent and nationwide. data.egov.kz open data, NBK KZT rates, Kazhydromet, 2GIS, Kaspi, Halyk, eGov, +7 telco, and more. Search it. Stack it. Ship it."
    />
    <link rel="canonical" href="https://kz.up.railway.app/" />
    <meta property="og:url" content="https://kz.up.railway.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Qazaq Stack" />
    <meta property="og:title" content="Qazaq Stack ~ every integration you need for Kazakhstan" />
    <meta
      property="og:description"
      content="Search it. Stack it. Ship it. The Kazakhstan integration directory — data.egov.kz, NBK KZT rates, 2GIS, Kaspi, Kazhydromet, eGov, +7 telco — with ready-made snippets and honest auth/pricing."
    />
    <meta property="og:image" content="https://kz.up.railway.app/og" />
    <meta property="og:image:type" content="image/gif" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Qazaq Stack — animated catalogue loader on a dark Kazakhstan API directory card"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kz.up.railway.app/og" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #fluid-background {
        background: #0a0a0a;
      }
      @media (prefers-reduced-motion: reduce) {
        #fluid-background {
          display: none;
        }
      }
      @keyframes khazak-hue-drift {
        from {
          filter: hue-rotate(0deg);
        }
        to {
          filter: hue-rotate(360deg);
        }
      }
      #fluid-background.is-live {
        animation: khazak-hue-drift 5s linear infinite;
      }
    </style>
  </head>
  <body>
    <div
      id="fluid-background"
      aria-hidden="true"
      style="position:fixed;inset:0;width:100vw;height:100dvh;min-height:-webkit-fill-available;pointer-events:none;overflow:hidden;z-index:0"
    ></div>
    <div id="root">
      <p
        id="boot-status"
        style="margin:0;padding:2rem;font-family:Inter,system-ui,sans-serif;color:#e8d4e0;text-align:center"
      >
        Loading Qazaq Stack…
      </p>
    </div>
    <script src="/fluid-init.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener("error", function (event) {
        var target = event.target;
        if (!target || target.tagName !== "SCRIPT" || target.type !== "module") return;
        var boot = document.getElementById("boot-status");
        if (!boot) return;
        boot.textContent = "Qazaq Stack failed to load. Hard refresh (Cmd+Shift+R) or clear cache for kz.up.railway.app.";
        boot.style.color = "#f5c2e7";
      }, true);
    </script>
  </body>
</html>
